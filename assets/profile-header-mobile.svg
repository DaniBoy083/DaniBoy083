<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Daniel Costa</title>
  <desc id="description">Código, dados e tecnologia para facilitar o cotidiano. Acessibilidade faz parte do meu olhar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
  </defs>
  <rect x=".5" y=".5" width="639" height="359" rx="20" fill="url(#background)" stroke="#303030"/>
  <rect x="1" y="1" width="638" height="358" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="36" y="61" fill="#a3a3a3" font-size="20" letter-spacing="3">DANIBOY083</text>
    <text x="32" y="149" fill="#f5f5f5" font-size="76" font-weight="700" letter-spacing="-3">Daniel Costa.</text>
    <text x="36" y="206" fill="#d4d4d4" font-size="29">Código, dados e tecnologia</text>
    <text x="36" y="246" fill="#d4d4d4" font-size="29">para facilitar o cotidiano.</text>
    <path d="M36 304 H60" stroke="#737373" stroke-width="2"/>
    <text x="76" y="310" fill="#a3a3a3" font-size="22">Acessibilidade faz parte do meu olhar.</text>
  </g>
</svg>
